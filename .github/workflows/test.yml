name: tests

on:
  push:
    branches: [main]
  pull_request:

# The suite needs nothing but a read of the code.
permissions:
  contents: read

jobs:
  bats:
    # ubuntu gives bash 5.x, macos gives 3.2 as /bin/bash - fd.sh must work on both.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        uses: bats-core/bats-action@3.0.0
        with:
          # Without a version the action asks api.github.com for the latest
          # release, unauthenticated; the shared macOS runner IPs exhaust that
          # rate limit and the install fails with 403 before any test runs.
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Versions
        run: |
          bash --version | head -1
          /bin/bash --version | head -1
          jq --version

      - name: Run suite
        run: bats tests/fd.bats

      - name: Run suite under /bin/bash (bash 3.2 on macOS)
        run: FD_BASH=/bin/bash bats tests/fd.bats

      - name: Suite must catch a note sent as public, or an edit to a note that is not yours
        # A suite that cannot fail proves nothing. The defects this skill must
        # never ship are a public note and an edit it has no right to make, so CI
        # plants each and expects red: a public note in the JSON payload and in
        # the multipart form a note with files uses, each guard of edit-note
        # switched off, and the HTTP layer letting a PUT carry more than a body.
        run: |
          for mutation in 's/private: true}/private: false}/' 's/private=true/private=false/' \
                          's/\[ "\$is_private" = true \]/true/' 's/\[ "\$owner" = "\$myid" \]/true/' \
                          's/\[ "\$on_ticket" = true \]/true/' 's/\[ "\$is_note" = true \]/true/' \
                          's/keys == \["body"\]/true/'; do
            sed "$mutation" freshdesk/fd.sh > /tmp/public_fd.sh
            if cmp -s freshdesk/fd.sh /tmp/public_fd.sh; then
              echo "The mutation '$mutation' did not apply: the note request changed shape. Update this step."
              exit 1
            fi
            if FD=/tmp/public_fd.sh bats tests/fd.bats > /tmp/public.log 2>&1; then
              echo "The suite passed with '$mutation' - it has no power to fail."
              cat /tmp/public.log
              exit 1
            fi
            echo "Failures with '$mutation', as expected:"
            grep -c '^not ok' /tmp/public.log
          done
